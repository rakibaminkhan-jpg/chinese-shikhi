name: chinese_shikhi
description: Bengali-first Mandarin Chinese learning app.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  google_mobile_ads: ^9.2.0
  material_ui: ^1.11.0
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/data/hsk_1_vocab_bengali.json
    - assets/data/hsk_2025_vocab.json
    - assets/data/hsk_examples.json
