name: Chinese Shikhi Release Build

on:
  workflow_dispatch:
  push:
    branches:
      - release-integration

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore Android signing files
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail

          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_STORE_PASSWORD"
          test -n "$ANDROID_KEY_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"

          mkdir -p android/app

          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode > android/app/upload-keystore-final.jks

          test -s android/app/upload-keystore-final.jks

          python3 - <<'PY'
          import os
          from pathlib import Path

          def escape(value):
              for char in ("\\", "\n", "\r", "\t", " ", ":", "=", "#", "!"):
                  value = value.replace(char, "\\" + char)
              return value

          content = (
              "storePassword=" + escape(os.environ["ANDROID_STORE_PASSWORD"]) + "\n"
              "keyPassword=" + escape(os.environ["ANDROID_KEY_PASSWORD"]) + "\n"
              "keyAlias=" + escape(os.environ["ANDROID_KEY_ALIAS"]) + "\n"
              "storeFile=upload-keystore-final.jks\n"
          )

          Path("android/key.properties").write_text(content)
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Build release App Bundle
        run: flutter build appbundle --release

      - name: Upload APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: chinese-shikhi-release
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          retention-days: 14
